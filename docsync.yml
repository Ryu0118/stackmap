rules:
- name: configuration-reference
  sources:
  - Sources/StackmapKit/Model/*.swift
  - Sources/StackmapKit/Loading/*.swift
  - Sources/StackmapKit/Scoping/*.swift
  - Sources/StackmapKit/Layout/*.swift
  doc: Sources/StackmapKit/StackmapKit.docc/ConfigurationFile.md
  message: Schema, validation, scoping, or layout changed - update the configuration
    reference.
  checksum: db9c8b6093410d711333628dd0f54db69a4525c8b9d394f5cdd190bb0221ba5c
- name: readme-cli
  sources:
  - Sources/StackmapCLI/*.swift
  - Sources/StackmapKit/Model/*.swift
  doc: README.md
  message: CLI surface or schema changed - update the README Quick Start and Commands
    table.
  checksum: 323c26c70ca462a07158f3893b6bbe206860f8372ab071efb03eb1ab5bd03bc4
excludes:
- '**/.build/**'
- .git/**
- '**/.swiftpm/**'
